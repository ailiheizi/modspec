script_version = "1"

[meta]
id = "test/dungeon-shooter-toast"
name = "Dungeon Shooter hook demo (toast)"
author = "modspec contributors"
description = """
Visible hook demo for com.ChillyRoom.DungeonShooter (Unity): hooks
BasePlayerApplication.onCreate and UnityPlayerActivity lifecycle methods,
showing an Android Toast when the hook fires so the effect is visible
in-game. Observe-only: no behavior is changed.
"""
tags = ["test", "dungeon-shooter", "demo", "toast"]
min_android = 26

[compatible]
packages = ["com.ChillyRoom.DungeonShooter"]
target_packages = ["com.ChillyRoom.DungeonShooter"]

[engine]
runtime = "js"
entrypoint = "src/main.js"

[limits]
execution_ms = 20000
callback_ms = 50
wait_class_ms = 30000

[permissions]
capabilities = ["emit", "log", "toast"]

[verify]
log_success = "hook_demo_ready"
log_failure = "hook_error"
