[workspace]
resolver = "2"
members = [
    "crates/modspec-core",
    "crates/modspec-protocol",
    "crates/modspec-cli",
    "crates/modspec-mcp",
]
default-members = ["crates/modspec-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["modspec contributors"]
repository = "https://github.com/modspec/modspec"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"

modspec-core = { path = "crates/modspec-core" }
modspec-protocol = { path = "crates/modspec-protocol" }
modspec-mcp = { path = "crates/modspec-mcp" }
