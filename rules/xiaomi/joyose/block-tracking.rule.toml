rule_version = "1"

[meta]
id = "xiaomi/joyose/block-tracking"
name = "屏蔽 Joyose 跟踪/广告请求"
description = "简化版：阻止常见网络回调（需 ROM 适配）。"
author = "modspec-community"
tags = ["xiaomi", "joyose", "privacy"]
min_android = 33

[compatible]
packages = ["com.xiaomi.joyose"]
oem = ["xiaomi"]

[[hooks]]
phase = "on_package_loaded"
target = { resolver = "static", class = "com.xiaomi.joyose.network.TrackReporter", method = "report", signature = "(Ljava/lang/String;)V" }
action = { kind = "skip" }

[verify]
log_success = "block-tracking.*hooked"
log_failure = "ClassNotFoundException"
