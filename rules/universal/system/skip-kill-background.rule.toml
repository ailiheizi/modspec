rule_version = "1"

[meta]
id = "universal/system/skip-kill-background"
name = "拦截 killBackgroundProcesses（system）"
description = """
通用后台保活思路，参考 AppRetentionHook / Don't Kill。
⚠️ 高风险实验：skip 会拦截系统对【所有】应用的 killBackgroundProcesses 调用，
可能破坏内存压力下的正常回收。仅用于调试验证 system_server hook 链路。
"""
author = "modspec-community"
tags = ["background", "keepalive", "universal", "experimental"]
min_android = 30

[compatible]
packages = ["system"]
scope_required = ["system"]

[[hooks]]
phase = "on_system_server_starting"
target = { resolver = "static", class = "com.android.server.am.ActivityManagerService", method = "killBackgroundProcesses", signature = "(Ljava/lang/String;I)V" }
action = { kind = "skip" }

  [hooks.options]
  priority = 0
  exception_mode = "protective"

[verify]
log_success = "skip-kill-background.*hooked"
log_failure = "Hook Failed"
